databaseChangeLog:
  - changeSet:
      id: 001-create-items-table
      author: arca9
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_items
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_items_name
              - column:
                  name: price
                  type: double precision
                  constraints:
                    nullable: false

        - createIndex:
            tableName: items
            indexName: idx_items_name
            columns:
              - column:
                  name: name
